[project]
name = "isaaclab-review-codex"
version = "0.1.0"
description = "Local GitHub App reviewer for Isaac Lab pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
